<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ScamShieldAI - Create Account</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<div class="auth-page">

    <div class="auth-card">

        <!-- =================================================
             LOGO
        ================================================== -->

        <div class="auth-logo">
            🛡️
        </div>


        <h1>
            ScamShield<span>AI</span>
        </h1>


        <p class="auth-subtitle">
            AI-Powered Scam Detection
        </p>


        <!-- =================================================
             REGISTER TITLE
        ================================================== -->

        <h2>
            Create Your Account
        </h2>


        <p class="auth-description">
            Create an account to access ScamShieldAI's
            security tools and community features.
        </p>


        <!-- =================================================
             REGISTER FORM
        ================================================== -->

        <form
            method="POST"
            class="auth-form"
        >

            <label for="username">
                Username
            </label>


            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                autocomplete="username"
                minlength="3"
                maxlength="100"
                required
            >


            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
            >
<p class="auth-hint">
    Use at least 6 characters for your password.
</p>

            <button
                type="submit"
                class="auth-btn"
            >
                📝 Create Account
            </button>

        </form>


        <!-- =================================================
             LOGIN LINK
        ================================================== -->

        <p class="auth-footer-text">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login here
            </a>

        </p>

    </div>

</div>

</body>

</html>
